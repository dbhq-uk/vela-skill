version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns:
          - "*"

  # NuGet, because this is the one skill in the org that is a compiled program
  # rather than instructions and a shell script. It is built on Roslyn, and
  # Roslyn is the whole proposition: the answers are compiler-exact because the
  # compiler gives them. A Microsoft.CodeAnalysis that falls behind the .NET SDK
  # it is asked to load is how "compiler-exact" quietly stops being true, so
  # these are worth a weekly pull request rather than an annual look.
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - dotnet
    commit-message:
      prefix: "deps"
    # The three MSBuild packages are pinned to whatever
    # Microsoft.CodeAnalysis.Workspaces.MSBuild resolves, and they are referenced
    # with ExcludeAssets="runtime" PrivateAssets="all" because MSBuildLocator
    # requires it. Bumping them on their own breaks the build rather than the
    # tests: on 17 Sep 2026 dependabot moved Framework and Utilities.Core to
    # 18.10.1, left Microsoft.Build at 17.11.48, and Framework 18.10.1 brought in
    # Microsoft.NET.StringTools as a PackageReference without ExcludeAssets, which
    # is the exact thing MSBL001 exists to refuse. They move with Roslyn, by hand.
    ignore:
      - dependency-name: "Microsoft.Build"
      - dependency-name: "Microsoft.Build.Framework"
      - dependency-name: "Microsoft.Build.Utilities.Core"
    groups:
      roslyn:
        patterns:
          - "Microsoft.CodeAnalysis*"
      other:
        patterns:
          - "*"
        exclude-patterns:
          - "Microsoft.CodeAnalysis*"
