name: Validate
# A push to a feature branch that already has a pull request open used to run the
# whole three-OS matrix twice, once for the push and once for the pull request.
# Filtering `push` to main leaves each commit covered exactly once: by its pull
# request while it is in review, and by the push run after it merges, which is the
# run that proves main itself is green.
#
# workflow_dispatch is the escape hatch that filter creates the need for: with
# push filtered to main, a branch without a pull request open cannot be run at
# all, so `gh workflow run Validate --ref <branch>` is the way to check one before
# asking for review.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Nothing used to stop a superseded run, so three pushes in a row left three full
# matrices burning. One group per ref, newest wins. Runs on main are exempt: they
# are the record of whether main is green at a given commit, and a later merge
# cancelling an earlier one would erase that answer for the earlier commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# The default for every job below. A job that needs more declares it itself;
# an explicit floor here means a new job cannot silently inherit an org
# setting somebody widened.
permissions:
  contents: read

jobs:
  test:
    # vela is a global tool people install on Windows and macOS as readily as on
    # Linux, and nothing but a run on those runners can say whether it works there.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # The suite scaffolds and harvests real projects, so it is minutes rather than
    # seconds. Without a limit a hung MSBuild or a wedged `dotnet new` runs for the
    # full six hours.
    #
    # 15, not 20. The slowest observed run is Windows at 8.5 minutes, so 15 still
    # leaves roughly 75% headroom for a cold NuGet cache, and the ceiling is what a
    # hang costs rather than what a healthy run needs: GitHub bills macOS at 10x, so
    # every minute of ceiling is ten billed minutes on the runner that hangs most
    # expensively. If a legitimate run ever comes close to 15, raise it deliberately
    # rather than letting the limit absorb a real slowdown unnoticed.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'
      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      # The tests scaffold real projects with `dotnet new webapp` / `dotnet new
      # blazor` and restore them, so this job needs network access to NuGet on
      # a cold cache. That is expected: fixture scaffolding is test setup, not
      # the tool under test.
      #
      # MSBuild verbosity stays at its default. `-v normal` buried the test results
      # under tens of thousands of file-copy lines, which is how three real failures
      # went unread for a week; the console logger below prints every test by name.
      - name: Test
        run: dotnet test --logger "console;verbosity=normal"
      - name: Assert Razor/Blazor generated-document coverage (the regression that would otherwise be silent)
        run: >-
          dotnet test --no-build
          --filter "DocumentEnumeratorTests|IndexWithStats_ReportsTheCoverageThatMustNotRegress"
          --logger "console;verbosity=normal"

  # THE SAME TWO LINTERS IN EVERY DBHQ SKILL REPO, added 17 Sep 2026. Nine of
  # the fourteen ran no linter at all, in an estate that is mostly bash and
  # Python - so a shell quoting hazard or a name that does not exist was only
  # caught by somebody reading the diff.
  #
  # IT IS A DELIBERATELY NARROW RUFF SELECTION. `E9` is syntax errors and
  # `F` is the pyflakes set: undefined names, unused imports, f-strings with no
  # placeholders. Those are bugs. The full default selection flags import order
  # and whitespace across every one of these repos, which would have meant
  # reformatting thousands of lines in code other sessions are working in
  # before the gate could go green - a large diff to buy a gate that catches
  # less than this one does. garmin and imager run the full ruff and keep it.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No `version` in plugin.json, on purpose (24 Sep 2026). Claude Code only
      # updates an installed plugin when this field changes, it was never bumped,
      # and marketplace installs sat on old code for weeks. With no version the
      # commit is the version, so every merge to main reaches users.
      - name: plugin.json carries no version
        run: jq -e 'has("version") | not' .claude-plugin/plugin.json > /dev/null

      # A real YAML parse, not a search for `name:` and `description:`. On 18 Sep
      # an unquoted `: ` inside the description made the frontmatter invalid YAML
      # with both keys still present, so a key search passed it. Claude Code
      # tolerated the break; a strict loader, such as Codex's, skips the skill.
      - name: Every SKILL.md has frontmatter that parses as YAML
        run: |
          python3 -m pip install --quiet --break-system-packages pyyaml
          python3 - <<'PY'
          import pathlib, re, sys, yaml
          skills = sorted(pathlib.Path("skills").glob("*/SKILL.md"))
          if not skills:
              sys.exit("no skills/*/SKILL.md found")
          ok = True
          for skill in skills:
              text = skill.read_text(encoding="utf-8")
              match = re.match(r"^---\n(.*?)\n---\n", text, re.S)
              if not match:
                  print(f"{skill}: no frontmatter")
                  ok = False
                  continue
              try:
                  meta = yaml.safe_load(match.group(1))
              except yaml.YAMLError as err:
                  print(f"{skill}: frontmatter is not valid YAML: {err}")
                  ok = False
                  continue
              if not isinstance(meta, dict):
                  print(f"{skill}: frontmatter is not a mapping")
                  ok = False
                  continue
              directory = skill.parent.name
              if meta.get("name") != directory:
                  print(f"{skill}: name is {meta.get('name')!r}, directory is {directory!r}")
                  ok = False
              description = meta.get("description")
              if not isinstance(description, str) or not description.strip():
                  print(f"{skill}: description is missing or empty")
                  ok = False
          sys.exit(0 if ok else 1)
          PY

      # The plugin and skills.sh installs copy SKILL.md and no binary. An agent
      # whose first instruction is `vela index` fails with no way forward, so the
      # skill must check for the command before it first runs it.
      - name: SKILL.md checks for the vela command before it runs vela index
        run: |
          check=$(grep -n -m1 'command -v vela' skills/vela/SKILL.md | cut -d: -f1)
          first=$(grep -n -m1 '^vela index' skills/vela/SKILL.md | cut -d: -f1)
          if [ -z "$check" ] || [ -z "$first" ] || [ "$check" -ge "$first" ]; then
            echo "skills/vela/SKILL.md must run 'command -v vela' before its first 'vela index'"
            exit 1
          fi

      - name: shellcheck
        # -S warning, not the default, because `info` and `style` fire on
        # idioms these scripts use deliberately. xargs -r so a repo with no
        # shell scripts is a pass rather than a shellcheck usage error.
        run: |
          find . -name '*.sh' -not -path '*/.venv/*' -print0 \
            | xargs -0 -r shellcheck -S warning

  # Nothing used to run the installers, so `./install.sh` failing from the
  # repository root - which is how the README says to run it - was only found by
  # hand, weeks after it broke. This runs both installers for real, from the
  # repository root, under a throwaway HOME, and checks what they leave behind:
  # the skill where Claude Code and Codex look for it, and a vela built from this
  # very commit rather than one already on the machine.
  #
  # Linux only. The installers are bash, and the three-OS matrix above already
  # proves the tool builds and passes on each platform.
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'
      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      - name: Run install.sh and install-codex.sh from the repository root
        run: |
          # The package cache stays where actions/cache put it; everything else the
          # installers touch lands in the throwaway HOME.
          export NUGET_PACKAGES="$HOME/.nuget/packages"
          HOME="$(mktemp -d)"
          export HOME
          export PATH="$HOME/.dotnet/tools:$PATH"

          ./install.sh
          ./install-codex.sh

          test -f "$HOME/.claude/skills/vela/SKILL.md" \
            || { echo "install.sh did not link the skill into ~/.claude/skills"; exit 1; }
          test -f "$HOME/.codex/skills/vela/SKILL.md" \
            || { echo "install-codex.sh did not install the skill into ~/.codex/skills"; exit 1; }

          installed="$(command -v vela)"
          case "$installed" in
            "$HOME/.dotnet/tools/vela") ;;
            *) echo "vela resolves to $installed, not the one the installer put in $HOME"; exit 1 ;;
          esac

          version="$(vela --version)"
          commit="$(git rev-parse --short HEAD)"
          echo "vela --version: $version"
          echo "commit:         $commit"
          case "$version" in
            *"+$commit"*) ;;
            *) echo "the installed vela was not built from this commit"; exit 1 ;;
          esac
